<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expresiones</title>
  <meta name="description" content="Rosas eternas hechas con amor. Ramos, materiales y comunidad emprendedora." />
  <meta property="og:title" content="Expresiones" />
  <meta property="og:description"
    content="Rosas eternas hechas con amor. Ramos personalizados, materiales para emprender y comunidad de emprendedoras." />
  <meta property="og:image" content="https://gardeneternaljym.github.io/logo2.png" />
  <meta property="og:url" content="https://gardeneternaljym.github.io/" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_PE" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Nunito:wght@300;400;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    referrerpolicy="no-referrer" />
  <style>
    :root {
      /* Paleta sacada de la foto real del puesto: rosa-durazno + dorado cálido + turquesa de acento */
      --cream: #FFF6EE;
      /* fondo, crema cálido como el mantel */
      --card: #FFFDF9;
      /* fondo de tarjetas y botones */
      --ink: #3D2418;
      /* texto principal, marrón oscuro del letrero cursivo */
      --rose: #D9718F;
      /* rosa-durazno de los envoltorios — acento fuerte */
      --terracotta: #C98A2B;
      /* dorado ámbar de la iluminación — acento secundario */
      --coral: #E8A15E;
      /* durazno dorado — bordes */
      --peach: #FBE3D3;
      /* durazno pálido — hover / iconos */
      --muted: #9C6B5C;
      /* texto secundario, marrón rosado */
      --turquoise: #4FB3A9;
      /* toque turquesa de contraste, visto en un par de envolturas */
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      max-width: 420px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .banner-wrap {
      position: relative;
      margin: -40px -20px 0;
      width: calc(100% + 40px);
    }

    .banner-inner {
      position: relative;
      height: 170px;
      overflow: hidden;
    }

    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.1) brightness(0.97);
    }

    /* Degradado suave y parejo hacia el color de fondo de la página */
    .banner-fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
          rgba(61, 52, 24, 0.08) 0%,
          rgba(255, 251, 239, 0) 45%,
          rgba(255, 251, 239, 0.55) 78%,
          var(--cream) 100%);
      pointer-events: none;
    }

    .logo-img {
      width: 112px;
      height: 112px;
      border-radius: 28%;
      object-fit: cover;
      display: block;
      border: 3px solid var(--card);
      background: var(--card);
      box-shadow: 0 10px 24px rgba(61, 52, 24, 0.18), 0 0 0 1px rgba(246, 199, 68, 0.18);

      position: relative;
      margin: -56px auto 0;
      z-index: 2;
    }

    /* Redes sociales arriba, debajo del logo: solo ícono, sin texto */
    .social-row-top {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 16px;
      margin-bottom: 34px;
    }

    .social-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--card);
      border: 1.5px solid var(--coral);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--ink);
      transition: background .15s, transform .1s, box-shadow .15s;
      box-shadow: 0 2px 6px rgba(61, 52, 24, 0.08);
    }

    .social-icon i {
      font-size: 22px;
      line-height: 1;
    }

    .social-icon .fa-tiktok {
      color: #111;
    }

    .social-icon .fa-instagram {
      color: #D62976;
    }

    .social-icon .fa-facebook-f {
      color: #1877F2;
    }

    .social-icon:hover {
      background: var(--peach);
      box-shadow: 0 4px 10px rgba(61, 52, 24, 0.14);
    }

    .social-icon:active {
      transform: scale(.95);
    }

    /* SECTIONS */
    .section {
      margin-bottom: 28px;
    }

    .section-label {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--terracotta);
      margin-bottom: 10px;
    }

    /* BUTTONS */
    .btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      background: var(--card);
      border: 1.5px solid var(--coral);
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      color: var(--ink);
      font-family: 'Nunito', sans-serif;
      font-size: .88rem;
      transition: background .15s, transform .15s, box-shadow .15s, border-color .15s;
      margin-bottom: 8px;
      box-shadow: 0 3px 10px rgba(61, 36, 24, .06);
    }

    .btn:hover {
      background: var(--peach);
      border-color: var(--rose);
      box-shadow: 0 7px 18px rgba(61, 36, 24, .11);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn-icon {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: linear-gradient(145deg, #FFE8EE, #F8CAD6);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(217, 113, 143, .14), 0 4px 10px rgba(217, 113, 143, .14);
    }

    .btn-icon i {
      color: var(--rose);
      font-size: 23px;
      line-height: 1;
      filter: drop-shadow(0 1px 1px rgba(61, 36, 24, .08));
    }

    .btn-icon--materials {
      background: linear-gradient(145deg, #FFF3D9, #F8D9A8);
      box-shadow: inset 0 0 0 1px rgba(201, 138, 43, .16), 0 4px 10px rgba(201, 138, 43, .13);
    }

    .btn-icon--materials i {
      color: var(--terracotta);
    }

    .btn-icon--community {
      background: linear-gradient(145deg, #E2F9EB, #C5F0D7);
      box-shadow: inset 0 0 0 1px rgba(37, 211, 102, .16), 0 4px 10px rgba(37, 211, 102, .12);
    }

    .btn-icon--community i {
      color: #128C4B;
    }

    .btn-text {
      flex: 1;
      text-align: left;
    }

    .btn-text strong {
      display: block;
      font-size: .86rem;
      font-weight: 600;
    }

    .btn-text span {
      display: block;
      font-size: .72rem;
      color: var(--muted);
    }

    .btn-arrow {
      font-size: 1.1rem;
      color: var(--rose);
    }

    /* TOAST: confirmación flotante tras copiar */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #FFF6EE;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 600;
      text-align: center;
      max-width: 90%;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* FOOTER */
    .footer {
      text-align: center;
      font-size: .68rem;
      color: var(--muted);
      margin-top: 32px;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="hero">
      <div class="banner-wrap">
        <div class="banner-inner">
          <img class="banner-img" src="banner.png" alt="Banner Expresiones" />
          <div class="banner-fade"></div>
        </div>
        <img class="logo-img" src="logo2.png" alt="Expresiones" />
      </div>
      <div class="social-row-top">
        <a href="https://www.tiktok.com/@expresiones_eternas" target="_blank" rel="noopener noreferrer" class="social-icon"
          aria-label="TikTok">
          <i class="fa-brands fa-tiktok" aria-hidden="true"></i>
        </a>
        <a href="https://www.instagram.com/expreciones_eternas" target="_blank" rel="noopener noreferrer"
          class="social-icon" aria-label="Instagram">
          <i class="fa-brands fa-instagram" aria-hidden="true"></i>
        </a>
        <a href="https://www.facebook.com/share/1DPNxAcHdv/" target="_blank"
          rel="noopener noreferrer" class="social-icon" aria-label="Facebook">
          <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
        </a>
      </div>

      <main>
      <!-- PARA REGALAR -->
      <div class="section">
        <p class="section-label">Para regalar</p>
        <a href="https://wa.me/51956744914?text=Hola%2C%20quiero%20pedir%20un%20ramo%20%F0%9F%8C%B7" target="_blank" rel="noopener noreferrer" class="btn"
          data-copy="https://wa.me/51956744914?text=Hola%2C%20quiero%20pedir%20un%20ramo%20%F0%9F%8C%B7" data-copy-type="link">
          <div class="btn-icon" aria-hidden="true">
            <i class="fa-solid fa-spa" aria-hidden="true"></i>
          </div>
          <div class="btn-text">
            <strong>Pedir mi ramo</strong>
            <span>Personalizado, hecho a mano</span>
          </div>
          <span class="btn-arrow">›</span>
        </a>
      </div>

      <!-- PARA EMPRENDER -->
      <div class="section">
        <p class="section-label">Para emprender</p>
        <a href="https://wa.me/51956744914?text=Hola%2C%20quiero%20comprar%20materiales%20%F0%9F%AA%B7" target="_blank" rel="noopener noreferrer" class="btn"
          data-copy="https://wa.me/51956744914?text=Hola%2C%20quiero%20comprar%20materiales%20%F0%9F%AA%B7" data-copy-type="link">
          <div class="btn-icon btn-icon--materials" aria-hidden="true">
            <i class="fa-solid fa-basket-shopping" aria-hidden="true"></i>
          </div>
          <div class="btn-text">
            <strong>Comprar materiales</strong>
            <span>Flores, cintas, bases y más</span>
          </div>
          <span class="btn-arrow">›</span>
        </a>
        <a href="https://chat.whatsapp.com/CMHPDhzzyfnKDMrn21aZUr" target="_blank" rel="noopener noreferrer" class="btn"
          data-copy="https://chat.whatsapp.com/CMHPDhzzyfnKDMrn21aZUr" data-copy-type="link">
          <div class="btn-icon btn-icon--community" aria-hidden="true">
            <i class="fa-solid fa-people-group" aria-hidden="true"></i>
          </div>
          <div class="btn-text">
            <strong>Comunidad gratis</strong>
            <span>Aprende y crece con nosotras</span>
          </div>
          <span class="btn-arrow">›</span>
        </a>
      </div>
    </main>

    <footer class="footer">
      Expresiones &copy; 2026 &middot; Perú
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isInAppBrowser = /musical_ly|tiktok|bytedance|ttwebview|instagram|FBAN|FBAV/i.test(ua);

      if (!isInAppBrowser) return;

      var toast = document.getElementById('toast');
      var toastTimer = null;

      function showToast(msg) {
        if (!toast) return;
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove('show');
        }, 3800);
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Respaldo para navegadores muy antiguos sin Clipboard API
        window.prompt('Copia esto manualmente:', text);
        return Promise.resolve();
      }

      // TikTok puede bloquear los enlaces externos; dentro de su navegador
      // copiamos el destino y mostramos una confirmación breve.
      var copiables = document.querySelectorAll('[data-copy]');
      copiables.forEach(function (el) {
        el.addEventListener('click', function (e) {
          e.preventDefault();
          var text = el.getAttribute('data-copy');
          var type = el.getAttribute('data-copy-type');
          copyText(text).then(function () {
            if (type === 'phone') {
              showToast('📋 ¡Número copiado! Abre WhatsApp y pégalo en “Nuevo chat”');
            } else {
              showToast('🔗 ¡Enlace copiado! Pégalo en Chrome o Safari para abrirlo');
            }
          });
        });
      });
    })();
  </script>

</body>

</html>
