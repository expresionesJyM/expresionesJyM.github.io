<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expresiones</title>
  <meta name="description" content="Rosas eternas hechas con amor. Ramos, materiales y comunidad emprendedora."/>
  <meta property="og:title" content="Expresiones" />
  <meta property="og:description" content="Rosas eternas hechas con amor. Ramos personalizados, materiales para emprender y comunidad de emprendedoras." />
  <meta property="og:image" content="https://gardeneternaljym.github.io/logo2.png" />
  <meta property="og:url" content="https://gardeneternaljym.github.io/" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_PE" />
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      /* Paleta sacada de la foto real del puesto */
      --cream:       #FBEBDC; /* fondo, del beige/durazno claro */
      --card:        #FFF7EE; /* fondo de tarjetas y botones */
      --ink:         #431A12; /* texto principal, marrón oscuro */
      --rose:        #A02E28; /* rojo rosa de las rosas — acento fuerte */
      --terracotta:  #D8723B; /* terracota — acento secundario */
      --coral:       #F3925F; /* coral cálido — bordes */
      --peach:       #FBCFA0; /* durazno — hover / iconos */
      --muted:       #99604C; /* texto secundario, marrón rosado */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      max-width: 420px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .banner-wrap {
      position: relative;
      margin: -40px -20px 28px; /* antes 56px: acerca el contenido al logo */
      width: calc(100% + 40px);
    }

    .banner-inner {
      position: relative;
      height: 170px;
      overflow: hidden;
    }

    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.1) brightness(0.97);
    }

    /* Degradado suave hacia el color de fondo de la página */
    .banner-fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(67, 26, 18, 0.14) 0%,
        rgba(251, 235, 220, 0) 55%,
        var(--cream) 100%
      );
      pointer-events: none;
    }

    .logo-img {
      width: 110px;
      height: 110px;
      border-radius: 30%;
      object-fit: cover;
      border: 3px solid var(--cream);
      background: var(--cream);
      box-shadow: 0 4px 14px rgba(67, 26, 18, 0.22);

      position: absolute;
      left: 50%;
      bottom: -43px;
      transform: translateX(-50%);
      z-index: 2;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 0 0 14px; /* antes 32px: menos espacio bajo el logo */
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.65rem;
      font-weight: 400;
      color: var(--rose);
      margin-bottom: 5px;
    }

    .hero h1 em { font-style: italic; }

    .hero p {
      font-size: .8rem;
      color: var(--muted);
    }

    .divider {
      height: 1.5px;
      background: var(--coral);
      border-radius: 2px;
      margin: 0 0 28px;
    }

    /* SECTIONS */
    .section { margin-bottom: 28px; }

    .section-label {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--terracotta);
      margin-bottom: 10px;
    }

    /* BUTTONS */
    .btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      background: var(--card);
      border: 1.5px solid var(--coral);
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      color: var(--ink);
      font-family: 'Nunito', sans-serif;
      font-size: .88rem;
      transition: background .15s, transform .1s;
      margin-bottom: 8px;
    }

    .btn:hover  { background: var(--peach); }
    .btn:active { transform: scale(.98); }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--peach);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .btn-text { flex: 1; text-align: left; }
    .btn-text strong { display: block; font-size: .86rem; font-weight: 600; }
    .btn-text span   { display: block; font-size: .72rem; color: var(--muted); }
    .btn-arrow { font-size: 1.1rem; color: var(--rose); }

    .featured-wrap {
      display: flex;
      align-items: center;
      gap: 12px; /* separa la foto del botón */
      margin-bottom: 8px;
    }

    .icon-carousel {
      position: relative;
      width: 130px;
      height: 130px;
      flex-shrink: 0;
      overflow: hidden;
      background: var(--peach);
      border: 1.5px solid var(--coral);
      border-radius: 20px; /* redondeado completo, ya no se pega al botón */
      z-index: 2;
    }

    .icon-carousel img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .icon-carousel img.is-active {
      opacity: 1;
    }

    .btn-featured {
      flex: 1;
      height: 80px;
      margin-bottom: 0;
      padding: 16px;
      border: 1.5px solid var(--coral);
      border-radius: 18px; /* las 4 esquinas, ya no comparte lado con la foto */
    }

    .btn-featured .btn-text strong { font-size: 1rem; }
    .btn-featured .btn-text span   { font-size: .78rem; margin-top: 2px; }
    .btn-featured .btn-arrow       { font-size: 1.3rem; }

    /* FILA "Comprar materiales" / "Comunidad gratis":
       misma altura/tamaño de foto y de botón que "Pedir mi ramo",
       para que ambas secciones se vean armonizadas. */
    .split-row {
      display: flex;
      gap: 12px;
    }

    .split-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
      margin-bottom: 8px;
    }

    .split-photo {
      width: 130px;
      height: 130px;
      max-width: 100%;
      background: var(--peach);
      border: 1.5px solid var(--coral);
      border-radius: 20px;
      overflow: hidden;
    }

    .split-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .btn-split {
      width: 100%;
      height: 80px;
      margin-bottom: 0;
      padding: 16px;
      border: 1.5px solid var(--coral);
      border-radius: 18px;
    }

    .btn-split .btn-text strong { font-size: .9rem; }
    .btn-split .btn-text span   { font-size: .72rem; margin-top: 2px; }
    .btn-split .btn-arrow       { font-size: 1.2rem; }

    /* SOCIAL */
    .social-row { display: flex; gap: 8px; }

    .social-btn {
      flex: 1;
      padding: 12px 8px;
      text-align: center;
      background: var(--card);
      border: 1.5px solid var(--coral);
      border-radius: 14px;
      font-size: .73rem;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      transition: background .15s;
    }

    .social-btn:hover { background: var(--peach); }

    /* FOOTER */
    .footer {
      text-align: center;
      font-size: .68rem;
      color: var(--muted);
      margin-top: 32px;
      line-height: 1.8;
    }
  </style>
</head>
<body>

<div class="page">

  <header class="hero">
    <div class="banner-wrap">
      <div class="banner-inner">
        <img class="banner-img" src="banner.png" alt="Banner Expresiones"/>
        <div class="banner-fade"></div>
      </div>
      <img class="logo-img" src="logo2.png" alt="Expresiones"/>
    </div>
  </header>
  <main>

    <!-- PARA REGALAR -->
    <div class="section">
      <p class="section-label">Para regalar</p>
      <div class="featured-wrap">
        <div class="icon-carousel" data-carousel>
          <img src="ramo1.png" alt="Ramo hecho a mano" class="is-active"/>
          <img src="ramo2.png" alt="Ramo hecho a mano"/>
          <img src="ramo3.png" alt="Ramo hecho a mano"/>
          <img src="ramo4.png" alt="Ramo hecho a mano"/>
        </div>
        <a onclick="abrirWhatsApp('')" class="btn btn-featured">
          <div class="btn-text">
            <strong>Pedir mi ramo</strong>
            <span>Personalizado, hecho a mano</span>
          </div>
          <span class="btn-arrow">›</span>
        </a>
      </div>
    </div>

    <!-- PARA EMPRENDER -->
    <div class="section">
      <p class="section-label">Para emprender</p>
      <div class="split-row">
        <div class="split-wrap">
          <div class="split-photo"><img src="materiales.png" alt="Comprar materiales"/></div>
          <a onclick="abrirWhatsApp('')" class="btn btn-split">
            <div class="btn-text">
              <strong>Comprar materiales</strong>
              <span>Flores, cintas, bases y más</span>
            </div>
            <span class="btn-arrow">›</span>
          </a>
        </div>
        <div class="split-wrap">
          <div class="split-photo"><img src="comunidad.png" alt="Comunidad gratis"/></div>
          <a href="https://chat.whatsapp.com/CMHPDhzzyfnKDMrn21aZUr" class="btn btn-split">
            <div class="btn-text">
              <strong>Comunidad gratis</strong>
              <span>Aprende y crece con nosotras</span>
            </div>
            <span class="btn-arrow">›</span>
          </a>
        </div>
      </div>
    </div>

    <!-- REDES -->
    <div class="section">
      <p class="section-label">Síguenos</p>
      <div class="social-row">
        <a href="https://www.tiktok.com/@garden_eternal" target="_blank" class="social-btn">TikTok</a>
        <a href="https://www.instagram.com/gardeneternal_jm/" target="_blank" class="social-btn">Instagram</a>
        <a href="https://www.facebook.com/people/Garden-Rosas-Eternas/61574939932181/?locale=es_LA" target="_blank" class="social-btn">Facebook</a>
      </div>
    </div>

  </main>

  <footer class="footer">
    Expresiones &copy; 2026 &middot; Perú
  </footer>

</div>

<script>
  function abrirWhatsApp(texto) {
    var numero = '51956744914';
    var t = encodeURIComponent(texto);
    window.location.href = 'whatsapp://send?phone=' + numero + '&text=' + t;
    setTimeout(function() {
      window.location.href = 'https://wa.me/' + numero + '?text=' + t;
    }, 1500);
  }

  // Carrusel con desvanecido: cambia la foto activa cada 3 segundos.
  // Funciona con cualquier cantidad de <img> dentro de [data-carousel].
  document.querySelectorAll('[data-carousel]').forEach(function (carousel) {
    var imgs = carousel.querySelectorAll('img');
    if (imgs.length < 2) return;
    var current = 0;
    setInterval(function () {
      imgs[current].classList.remove('is-active');
      current = (current + 1) % imgs.length;
      imgs[current].classList.add('is-active');
    }, 3000);
  });
</script>

</body>
</html>
