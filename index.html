<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expresiones</title>
  <meta name="description" content="Rosas eternas hechas con amor. Ramos, materiales y comunidad emprendedora."/>
  <meta property="og:title" content="Expresiones" />
  <meta property="og:description" content="Rosas eternas hechas con amor. Ramos personalizados, materiales para emprender y comunidad de emprendedoras." />
  <meta property="og:image" content="https://gardeneternaljym.github.io/logo2.png" />
  <meta property="og:url" content="https://gardeneternaljym.github.io/" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_PE" />
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      /* Paleta sacada de la foto real del puesto */
      --cream:       #FBEBDC; /* fondo, del beige/durazno claro */
      --card:        #FFF7EE; /* fondo de tarjetas y botones */
      --ink:         #431A12; /* texto principal, marrón oscuro */
      --rose:        #A02E28; /* rojo rosa de las rosas — acento fuerte */
      --terracotta:  #D8723B; /* terracota — acento secundario */
      --coral:       #F3925F; /* coral cálido — bordes */
      --peach:       #FBCFA0; /* durazno — hover / iconos */
      --muted:       #99604C; /* texto secundario, marrón rosado */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      max-width: 420px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .banner-wrap {
      position: relative;
      margin: -40px -20px 0;
      width: calc(100% + 40px);
    }

    .banner-inner {
      position: relative;
      height: 170px;
      overflow: hidden;
    }

    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.1) brightness(0.97);
    }

    /* Degradado suave y parejo hacia el color de fondo de la página */
    .banner-fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(67, 26, 18, 0.08) 0%,
        rgba(251, 235, 220, 0) 45%,
        rgba(251, 235, 220, 0.55) 78%,
        var(--cream) 100%
      );
      pointer-events: none;
    }

    .logo-img {
      width: 112px;
      height: 112px;
      border-radius: 28%;
      object-fit: cover;
      display: block;
      border: 3px solid var(--card);
      background: var(--card);
      box-shadow: 0 10px 24px rgba(67, 26, 18, 0.20), 0 0 0 1px rgba(216, 114, 59, 0.12);

      position: relative;
      margin: -56px auto 0;
      z-index: 2;
    }

    /* Redes sociales arriba, debajo del logo: solo ícono, sin texto */
    .social-row-top {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 16px;
      margin-bottom: 34px;
    }

    .social-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--card);
      border: 1.5px solid var(--coral);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--ink);
      transition: background .15s, transform .1s, box-shadow .15s;
      box-shadow: 0 2px 6px rgba(67, 26, 18, 0.08);
    }

    .social-icon svg { width: 22px; height: 22px; display: block; }

    .social-icon:hover  { background: var(--peach); box-shadow: 0 4px 10px rgba(67, 26, 18, 0.14); }
    .social-icon:active { transform: scale(.95); }

    /* SECTIONS */
    .section { margin-bottom: 28px; }

    .section-label {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--terracotta);
      margin-bottom: 10px;
    }

    /* BUTTONS */
    .btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      background: var(--card);
      border: 1.5px solid var(--coral);
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      color: var(--ink);
      font-family: 'Nunito', sans-serif;
      font-size: .88rem;
      transition: background .15s, transform .1s;
      margin-bottom: 8px;
    }

    .btn:hover  { background: var(--peach); }
    .btn:active { transform: scale(.98); }

    .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--peach);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .btn-text { flex: 1; text-align: left; }
    .btn-text strong { display: block; font-size: .86rem; font-weight: 600; }
    .btn-text span   { display: block; font-size: .72rem; color: var(--muted); }
    .btn-arrow { font-size: 1.1rem; color: var(--rose); }

    /* FOOTER */
    .footer {
      text-align: center;
      font-size: .68rem;
      color: var(--muted);
      margin-top: 32px;
      line-height: 1.8;
    }
  </style>
</head>
<body>

<div class="page">

  <header class="hero">
    <div class="banner-wrap">
      <div class="banner-inner">
        <img class="banner-img" src="banner.png" alt="Banner Expresiones"/>

      </div>
      <img class="logo-img" src="logo2.png" alt="Expresiones"/>
    </div>
    <div class="social-row-top">
      <a href="https://www.tiktok.com/@garden_eternal" target="_blank" class="social-icon" aria-label="TikTok">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M32.5 6c1 4.2 3.7 7 8 7.6v6.1c-2.9.2-5.6-.7-8-2.4v13.1c0 7.4-6 12.6-12.7 12.6C13 43 7 37.7 7 30.4 7 23 13 17.7 19.8 17.7c.7 0 1.4.1 2.1.2v6.4c-.7-.2-1.4-.3-2.1-.3-3.6 0-6.5 3-6.5 6.4s2.9 6.4 6.5 6.4 6.7-2.9 6.7-6.4V6h6z" fill="#431A12"/>
        </svg>
      </a>
      <a href="https://www.instagram.com/gardeneternal_jm/" target="_blank" class="social-icon" aria-label="Instagram">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="igGrad" x1="0" y1="48" x2="48" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#FEC053"/>
              <stop offset=".35" stop-color="#F2703E"/>
              <stop offset=".6" stop-color="#DC2E63"/>
              <stop offset=".85" stop-color="#9B32B8"/>
              <stop offset="1" stop-color="#6B31C1"/>
            </linearGradient>
          </defs>
          <rect x="6" y="6" width="36" height="36" rx="11" fill="url(#igGrad)"/>
          <rect x="14" y="14" width="20" height="20" rx="7" fill="none" stroke="#fff" stroke-width="2.6"/>
          <circle cx="24" cy="24" r="5.2" fill="none" stroke="#fff" stroke-width="2.6"/>
          <circle cx="33" cy="15" r="1.8" fill="#fff"/>
        </svg>
      </a>
      <a href="https://www.facebook.com/people/Garden-Rosas-Eternas/61574939932181/?locale=es_LA" target="_blank" class="social-icon" aria-label="Facebook">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
      </a>
    </div>
  </header>
  <main>

    <!-- PARA REGALAR -->
    <div class="section">

      <a onclick="abrirWhatsApp('')" class="btn">

        <div class="btn-text">
          <strong>Pedir mi ramo</strong>
          <span>Personalizado, hecho a mano</span>

    <!-- PARA EMPRENDER -->

        <span class="btn-arrow">›</span>
      </a>
      <a href="https://chat.whatsapp.com/CMHPDhzzyfnKDMrn21aZUr" class="btn">
        <div class="btn-icon">👩‍🤝‍👩</div>

        <span class="btn-arrow">›</span>

  </main>

  <footer class="footer">
    Expresiones &copy; 2026 &middot; Perú
  </footer>

</div>

<script>
  function abrirWhatsApp(texto) {
    var numero = '51956744914';
    var t = encodeURIComponent(texto);
    window.location.href = 'whatsapp://send?phone=' + numero + '&text=' + t;
    setTimeout(function() {
      window.location.href = 'https://wa.me/' + numero + '?text=' + t;
    }, 1500);
  }
</script>

</body>
</html>
