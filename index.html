<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expresiones</title>
  <meta name="description" content="Rosas eternas hechas con amor. Ramos, materiales y comunidad emprendedora." />
  <meta property="og:title" content="Expresiones" />
  <meta property="og:description"
    content="Rosas eternas hechas con amor. Ramos personalizados, materiales para emprender y comunidad de emprendedoras." />
  <meta property="og:image" content="https://expresionesjym.github.io/assets/images/logo2.png" />
  <meta property="og:url" content="https://expresionesjym.github.io/" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_PE" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Nunito:wght@300;400;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>

  <div class="page">

    <header class="hero">
      <div class="banner-wrap">
        <div class="banner-inner">
          <img class="banner-img" src="assets/images/banner.png" alt="Banner Expresiones" />
          <div class="banner-fade"></div>
        </div>
        <img class="logo-img" src="assets/images/logo2.png" alt="Expresiones" />
      </div>
      <div class="social-row-top" id="redes">
        <a href="https://www.tiktok.com/@expresiones_eternas" target="_blank" rel="noopener noreferrer" class="social-icon"
          aria-label="TikTok" data-copy="https://www.tiktok.com/@expresiones_eternas">
          <i class="fa-brands fa-tiktok" aria-hidden="true"></i>
        </a>
        <a href="https://www.instagram.com/expreciones_eternas" target="_blank" rel="noopener noreferrer"
          class="social-icon" aria-label="Instagram" data-copy="https://www.instagram.com/expreciones_eternas">
          <i class="fa-brands fa-instagram" aria-hidden="true"></i>
        </a>
        <a href="https://www.facebook.com/share/1DPNxAcHdv/" target="_blank"
          rel="noopener noreferrer" class="social-icon" aria-label="Facebook"
          data-copy="https://www.facebook.com/share/1DPNxAcHdv/">
          <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
        </a>
      </div>

      <main>
      <!-- PARA REGALAR -->
      <div class="section">
        <p class="section-label">Para regalar</p>
        <a href="https://wa.me/51956744914?text=Hola%2C%20quiero%20pedir%20un%20ramo%20%F0%9F%8C%B7" target="_blank" rel="noopener noreferrer" class="btn"
          data-copy="https://wa.me/51956744914?text=Hola%2C%20quiero%20pedir%20un%20ramo%20%F0%9F%8C%B7">
          <div class="btn-icon" aria-hidden="true">
            <img src="assets/images/ramitoicon.jpg" alt="" />
          </div>
          <div class="btn-text">
            <strong>Pedir mi ramo</strong>
            <span>Personalizado, hecho a mano</span>
          </div>
          <span class="btn-arrow">›</span>
        </a>
      </div>

      <!-- PARA EMPRENDER -->
      <div class="section">
        <p class="section-label">Para emprender</p>
        <a href="https://wa.me/51956744914?text=Hola%2C%20quiero%20comprar%20materiales%20%F0%9F%AA%B7" target="_blank" rel="noopener noreferrer" class="btn"
          data-copy="https://wa.me/51956744914?text=Hola%2C%20quiero%20comprar%20materiales%20%F0%9F%AA%B7">
          <div class="btn-icon btn-icon--materials" aria-hidden="true">
            <img src="assets/images/materialicon.jpg" alt="" />
          </div>
          <div class="btn-text">
            <strong>Comprar materiales</strong>
            <span>Flores, cintas, bases y más</span>
          </div>
          <span class="btn-arrow">›</span>
        </a>
        <a href="https://chat.whatsapp.com/CMHPDhzzyfnKDMrn21aZUr" target="_blank" rel="noopener noreferrer" class="btn"
          data-copy="https://chat.whatsapp.com/CMHPDhzzyfnKDMrn21aZUr">
          <div class="btn-icon btn-icon--community" aria-hidden="true">
            <img src="assets/images/comunidadicon.png" alt="" />
          </div>
          <div class="btn-text">
            <strong>Mi comunidad</strong>
            <span>Aprende y crece con nosotras</span>
          </div>
          <span class="btn-arrow">›</span>
        </a>
      </div>
    </main>

    <footer class="footer">
      Expresiones &copy; 2026 &middot; Perú
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <aside class="jashy-widget" id="jashyWidget" aria-label="Ayuda de Jashy">
    <div class="jashy-chat" id="jashyChat">
      <button class="jashy-chat-close" id="jashyClose" type="button" aria-label="Minimizar a Jashy">
        <span aria-hidden="true">−</span>
      </button>
      <span class="jashy-name">Jashy · aquí para ayudarte</span>
      <p class="jashy-message" id="jashyMessage" aria-live="polite" aria-atomic="true">¡Hola! Soy Jashy 🌷 ¡Bienvenidos a Expresiones!</p>
    </div>
    <button class="jashy-avatar-button" id="jashyAvatar" type="button" aria-label="Abrir los mensajes de Jashy" aria-expanded="true">
      <img src="assets/images/jashy.png" alt="Jashy saludando" />
    </button>
  </aside>
  <script src="assets/js/main.js" defer></script>

</body>

</html>
