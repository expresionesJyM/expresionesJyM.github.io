<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta property="og:title" content="Expresiones" />

    content="Rosas eternas hechas con amor. Ramos personalizados, materiales para emprender y comunidad de emprendedoras." />

    rel="stylesheet" />
  <style>
    :root {
      /* Paleta sacada de la foto real del puesto: rosa-durazno + dorado cálido + turquesa de acento */
      --cream: #FFF6EE;
      /* fondo, crema cálido como el mantel */
      --card: #FFFDF9;
      /* fondo de tarjetas y botones */
      --ink: #3D2418;
      /* texto principal, marrón oscuro del letrero cursivo */
      --rose: #D9718F;
      /* rosa-durazno de los envoltorios — acento fuerte */
      --terracotta: #C98A2B;
      /* dorado ámbar de la iluminación — acento secundario */
      --coral: #E8A15E;
      /* durazno dorado — bordes */
      --peach: #FBE3D3;
      /* durazno pálido — hover / iconos */
      --muted: #9C6B5C;
      /* texto secundario, marrón rosado */
      --turquoise: #4FB3A9;
      /* toque turquesa de contraste, visto en un par de envolturas */
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      max-width: 420px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .banner-wrap {
      position: relative;
      margin: -40px -20px 0;
      width: calc(100% + 40px);
    }

    .banner-inner {
      position: relative;
      height: 170px;
      overflow: hidden;
    }

    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.1) brightness(0.97);
    }

    /* Degradado suave y parejo hacia el color de fondo de la página */
    .banner-fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
          rgba(61, 52, 24, 0.08) 0%,
          rgba(255, 251, 239, 0) 45%,
          rgba(255, 251, 239, 0.55) 78%,
          var(--cream) 100%);
      pointer-events: none;
    }

    .logo-img {
      width: 112px;
      height: 112px;
      border-radius: 28%;
      object-fit: cover;
      display: block;
      border: 3px solid var(--card);
      background: var(--card);
      box-shadow: 0 10px 24px rgba(61, 52, 24, 0.18), 0 0 0 1px rgba(246, 199, 68, 0.18);

      position: relative;
      margin: -56px auto 0;
      z-index: 2;
    }

    /* Redes sociales arriba, debajo del logo: solo ícono, sin texto */
    .social-row-top {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 16px;
      margin-bottom: 34px;
    }

    .social-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--card);
      border: 1.5px solid var(--coral);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--ink);
      transition: background .15s, transform .1s, box-shadow .15s;
      box-shadow: 0 2px 6px rgba(61, 52, 24, 0.08);
    }

    .social-icon svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    .social-icon:hover {
      background: var(--peach);
      box-shadow: 0 4px 10px rgba(61, 52, 24, 0.14);
    }

    .social-icon:active {
      transform: scale(.95);
    }

    /* SECTIONS */
    .section {
      margin-bottom: 28px;
    }

    .section-label {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--terracotta);
      margin-bottom: 10px;
    }

    /* BUTTONS */
    .btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      background: var(--card);
      border: 1.5px solid var(--coral);
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      color: var(--ink);
      font-family: 'Nunito', sans-serif;
      font-size: .88rem;
      transition: background .15s, transform .1s;
      margin-bottom: 8px;
    }

    .btn:hover {
      background: var(--peach);
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--peach);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-icon svg {
      width: 22px;
      height: 22px;
      stroke: var(--rose);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-text {
      flex: 1;
      text-align: left;
    }

    .btn-text strong {
      display: block;
      font-size: .86rem;
      font-weight: 600;
    }

    .btn-text span {
      display: block;
      font-size: .72rem;
      color: var(--muted);
    }

    .btn-arrow {
      font-size: 1.1rem;
      color: var(--rose);
    }

    /* AVISO CORTO: explica que tocar copia el contacto (solo dentro de apps) */
    .copy-hint {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--peach);
      border-radius: 12px;
      padding: 10px 14px;
      margin: 14px 0 4px;
      font-size: .72rem;
      color: var(--ink);
      line-height: 1.4;
    }

    .copy-hint.show {
      display: flex;
    }

    /* TOAST: confirmación flotante tras copiar */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #FFF6EE;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 600;
      text-align: center;
      max-width: 90%;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* FOOTER */
    .footer {
      text-align: center;
      font-size: .68rem;
      color: var(--muted);
      margin-top: 32px;
      line-height: 1.8;
    }
  </style>
</head>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isInAppBrowser = /musical_ly|tiktok|bytedance|ttwebview|instagram|FBAN|FBAV/i.test(ua);

      if (!isInAppBrowser) return;

      // NOTA: se probó forzar la salida al navegador por código (intent://,
      // x-safari-https://) y TikTok lo bloquea activamente mostrando "la
      // acción no se pudo completar". Es una restricción de seguridad de la
      // app. La alternativa que sí funciona siempre: copiar el dato al
      // portapapeles (número o enlace) y que la persona lo pegue donde
      // corresponda manualmente.

      var hint = document.getElementById('copyHint');
      if (hint) hint.classList.add('show');

      var toast = document.getElementById('toast');
      var toastTimer = null;

      function showToast(msg) {
        if (!toast) return;
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove('show');
        }, 3800);
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        // Respaldo para navegadores muy antiguos sin Clipboard API
        window.prompt('Copia esto manualmente:', text);
        return Promise.resolve();
      }

      var copiables = document.querySelectorAll('[data-copy]');
      copiables.forEach(function (el) {
        el.addEventListener('click', function (e) {
          e.preventDefault();
          var text = el.getAttribute('data-copy');
          var type = el.getAttribute('data-copy-type');
          copyText(text).then(function () {
            if (type === 'phone') {
              showToast('📋 ¡Número copiado! Abre WhatsApp y pégalo en "Nuevo chat"');
            } else {
              showToast('🔗 ¡Enlace copiado! Pégalo en Chrome o Safari para abrirlo');
            }
          });
        });
      });
    })();
  </script>
